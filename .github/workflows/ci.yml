name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - uses: flox/install-flox-action@v2

      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('.flox/env/manifest.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 3G

      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/pre-commit
          key: deps-${{ runner.os }}-${{ hashFiles('bun.lock', '.pre-commit-config.yaml') }}
          restore-keys: deps-${{ runner.os }}-

      # The same hooks run locally on commit, so a green hook run is a green CI run.
      - name: pre-commit (format, lint, typecheck, test, build, docs, budgets, actionlint)
        run: flox activate -- pre-commit run --all-files --show-diff-on-failure
